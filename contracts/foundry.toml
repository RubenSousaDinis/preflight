# Preflight fixture contracts.
#
# These are the staged targets txGuard forks against on Base Sepolia (D3), plus anything
# else the contract boundary needs deployed. There is no external Solidity dependency on
# purpose: every fixture is plain Solidity, so the toolchain has no install step and cannot
# fail on a package registry at 3am.
#
# Build:  cd contracts && forge build
# Deploy: see README.md.

[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Keep the metadata hash, which is the default. It was set to "none" while scaffolding, on the
# reasoning that a stripped build is reproducible. It is, but so is this one: the metadata hash
# is itself a hash of source and settings, so two builds of unchanged source still match. What
# "none" costs is explorer verification, which can then only report a partial match, and D3's
# clean control has to read as verified because that is precisely what the bad callee is not.
bytecode_hash = "ipfs"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

# Explorer verification runs through Sourcify, which is the primary source of verified-status per
# 02-DECISIONS 13.2 and needs no API key:
#
#   forge verify-contract <address> src/<Fixture>.sol:<Fixture> --chain 84532 --verifier sourcify
#
# There is deliberately no [etherscan] block here. Foundry resolves that section eagerly, so a
# config naming a key nobody has set makes every verify fail, including the Sourcify ones. If an
# Etherscan V2 key is ever provisioned, it belongs on the command line rather than back in here.
