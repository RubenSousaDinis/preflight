# Preflight fixture contracts.
#
# These are the staged targets txGuard forks against on Base Sepolia (D3), plus anything
# else the contract boundary needs deployed. There is no external Solidity dependency on
# purpose: every fixture is plain Solidity, so the toolchain has no install step and cannot
# fail on a package registry at 3am.
#
# Build:  cd contracts && forge build
# Deploy: see README.md.

[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Strip the metadata hash so a rebuild of the same source produces the same bytecode. The
# whole product rests on a code fingerprint being reproducible, so the fixtures it is tested
# against must not change hash because a comment moved.
bytecode_hash = "none"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

# Explorer verification (Etherscan V2, one host for every chain, per 02-DECISIONS 13.2).
[etherscan]
base_sepolia = { key = "${BASE_SEPOLIA_EXPLORER_API_KEY}", chain = 84532, url = "https://api.etherscan.io/v2/api" }
base_mainnet = { key = "${BASE_MAINNET_EXPLORER_API_KEY}", chain = 8453, url = "https://api.etherscan.io/v2/api" }
